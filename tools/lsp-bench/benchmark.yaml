version: 1
servers_lock: servers.lock.yaml
fixtures_lock: fixtures.lock.yaml

profiles:
  smoke:
    warmup: 1
    samples: 2
    cold_samples: 1
    lifecycle_samples: 1
    timeout_ms: 10000
    scenarios:
      - synthetic-cold-and-warm
      - synthetic-incremental-edit-save
  default:
    warmup: 10
    samples: 100
    cold_samples: 5
    lifecycle_samples: 10
    timeout_ms: 30000
    scenarios:
      - synthetic-cold-and-warm
      - synthetic-incremental-edit-save
      - synthetic-symbol-rename
      - synthetic-file-create-rename-delete
      - synthetic-cache-fresh
      - synthetic-cache-reuse
      - synthetic-cache-invalidated
      - v4-core-cold-and-warm
      - v4-core-incremental-edit-save
      - v4-core-symbol-rename
      - v4-core-file-create-rename-delete
      - v4-core-cache-fresh
      - v4-core-cache-reuse
      - v4-core-cache-invalidated
      - aave-v3-origin-cold-and-warm
      - aave-v3-origin-incremental-edit-save
      - aave-v3-origin-cache-fresh
      - aave-v3-origin-cache-reuse
      - aave-v3-origin-cache-invalidated
      - optimism-bedrock-cold-and-warm
      - optimism-bedrock-incremental-edit-save
      - optimism-bedrock-cache-fresh
      - optimism-bedrock-cache-reuse
      - optimism-bedrock-cache-invalidated
  publish:
    warmup: 10
    samples: 100
    cold_samples: 5
    lifecycle_samples: 10
    timeout_ms: 60000
    network_isolation: true
    scenarios:
      - synthetic-cold-and-warm
      - synthetic-incremental-edit-save
      - synthetic-symbol-rename
      - synthetic-file-create-rename-delete
      - synthetic-cache-fresh
      - synthetic-cache-reuse
      - synthetic-cache-invalidated
      - v4-core-cold-and-warm
      - v4-core-incremental-edit-save
      - v4-core-symbol-rename
      - v4-core-file-create-rename-delete
      - v4-core-cache-fresh
      - v4-core-cache-reuse
      - v4-core-cache-invalidated
      - aave-v3-origin-cold-and-warm
      - aave-v3-origin-incremental-edit-save
      - aave-v3-origin-cache-fresh
      - aave-v3-origin-cache-reuse
      - aave-v3-origin-cache-invalidated
      - optimism-bedrock-cold-and-warm
      - optimism-bedrock-incremental-edit-save
      - optimism-bedrock-cache-fresh
      - optimism-bedrock-cache-reuse
      - optimism-bedrock-cache-invalidated

scenarios:
  - id: synthetic-cold-and-warm
    fixture: synthetic
    methods:
      - initialize
      - textDocument/hover
      - textDocument/definition
      - textDocument/references
      - textDocument/completion
      - textDocument/documentSymbol
    steps:
      - kind: open
        path: Main.sol
      - kind: probe
        name: cold-ready
        probe:
          kind: definition
          path: Main.sol
          anchor: call-member-position
          expected_path: Math.sol
          expected_anchor: math-double
      - kind: warm
        name: hover
        probe:
          kind: hover
          path: Main.sol
          anchor: call-member-position
          expected_text: double
      - kind: warm
        name: definition
        probe:
          kind: definition
          path: Main.sol
          anchor: call-member-position
          expected_path: Math.sol
          expected_anchor: math-double
      - kind: warm
        name: references
        probe:
          kind: references
          path: Main.sol
          anchor: call-member-position
          min_count: 2
      - kind: warm
        name: completion
        probe:
          kind: completion
          path: Main.sol
          anchor: completion-double
          expected_label: double
      - kind: warm
        name: document-symbol
        probe:
          kind: document-symbol
          path: Main.sol
          min_count: 3
          expected_name: Main

  - id: synthetic-incremental-edit-save
    fixture: synthetic
    methods:
      - textDocument/didChange
      - textDocument/didSave
      - textDocument/definition
    steps:
      - kind: open
        path: Main.sol
      - kind: replace
        path: Main.sol
        anchor: call-double
        text: Math.triple(input)
        probe:
          kind: definition
          path: Main.sol
          anchor: call-member-position
          expected_path: Math.sol
          expected_anchor: math-triple
      - kind: save
        path: Main.sol
        probe:
          kind: definition
          path: Main.sol
          anchor: call-member-position
          expected_path: Math.sol
          expected_anchor: math-triple

  - id: synthetic-symbol-rename
    fixture: synthetic
    methods:
      - textDocument/rename
      - workspace/applyEdit
    steps:
      - kind: open
        path: Main.sol
      - kind: rename
        path: Main.sol
        anchor: call-member-position
        new_name: doubled
        probe:
          kind: document-symbol
          path: Math.sol
          min_count: 2
          expected_name: doubled

  - id: synthetic-file-create-rename-delete
    fixture: synthetic
    methods:
      - workspace/didCreateFiles
      - workspace/didRenameFiles
      - workspace/didDeleteFiles
    steps:
      - kind: open
        path: Main.sol
      - kind: create-file
        path: Scratch.sol
        text: |
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.24;
          contract Scratch {}
        probe:
          kind: document-symbol
          path: Scratch.sol
          min_count: 1
          expected_name: Scratch
      - kind: rename-file
        from: Scratch.sol
        to: Renamed.sol
        probe:
          kind: document-symbol
          path: Renamed.sol
          min_count: 1
          expected_name: Scratch
      - kind: delete-file
        path: Renamed.sol
        probe:
          kind: document-symbol
          path: Main.sol
          min_count: 1
          expected_name: Main

  - id: synthetic-cache-fresh
    fixture: synthetic
    methods:
      - cache/fresh
    steps:
      - kind: open
        path: Main.sol
      - kind: probe
        name: cold-ready
        probe:
          kind: hover
          path: Main.sol
          anchor: main-contract
          expected_text: Main

  - id: synthetic-cache-reuse
    fixture: synthetic
    methods:
      - cache/reuse-after-restart
    steps:
      - kind: open
        path: Main.sol
      - kind: probe
        name: cache-populated
        probe:
          kind: hover
          path: Main.sol
          anchor: main-contract
          expected_text: Main
      - kind: restart
      - kind: open
        path: Main.sol
      - kind: probe
        name: cold-ready
        probe:
          kind: hover
          path: Main.sol
          anchor: main-contract
          expected_text: Main

  - id: synthetic-cache-invalidated
    fixture: synthetic
    methods:
      - cache/source-change-after-restart
    steps:
      - kind: open
        path: Main.sol
      - kind: probe
        name: cache-populated
        probe:
          kind: hover
          path: Main.sol
          anchor: main-contract
          expected_text: Main
      - kind: restart
        invalidate:
          path: Main.sol
          anchor: main-contract
          text: contract MainBench
      - kind: open
        path: Main.sol
      - kind: probe
        name: cold-ready
        probe:
          kind: document-symbol
          path: Main.sol
          min_count: 1
          expected_name: MainBench

  - id: v4-core-cold-and-warm
